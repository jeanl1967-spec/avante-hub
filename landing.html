<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avante Travel — Special Offers</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0DCDC2;
    --teal-dark:#0aa89f;
    --navy:#0e2f44;
    --ink:#333333;
    --muted:#808080;
    --mint:#f4fbfa;
    --line:#e3e9e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans', sans-serif;
    color:var(--ink);
    background:#ffffff;
  }
  h1,h2,h3,.brand,.tab{ font-family:'Montserrat', sans-serif; }

  .topbar{
    background:var(--teal);
    color:#fff;
    font-size:12.5px;
    padding:6px 24px;
    text-align:right;
  }

  header.hub-header{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding:18px 32px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:36px;
  }
  .brand{
    font-weight:800;
    font-size:22px;
    color:var(--teal);
    letter-spacing:0.01em;
    line-height:1.1;
  }
  .brand span{ display:block; color:var(--navy); font-size:14px; font-weight:600; letter-spacing:0.08em;}

  nav.tabs{
    display:flex;
    justify-content:flex-start;
    gap:14px;
    flex-wrap:wrap;
  }
  .tab{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--navy);
    font-weight:600;
    font-size:13.5px;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
    text-decoration:none;
    display:inline-block;
  }
  .tab:hover{ background:var(--mint); }
  .tab.disabled{ opacity:0.4; cursor:default; pointer-events:none; }

  @media (max-width: 900px){
    /* On narrow screens, wrap the tabs onto as many lines as needed
       instead of scrolling them off-screen — a horizontal scroll area
       hid tabs with no visual hint they existed. */
    header.hub-header{ gap:10px 20px; }
    nav.tabs{
      flex-wrap:wrap;
      gap:6px 10px;
      width:100%;
    }
    .tab{ padding:8px 12px; font-size:13px; }
  }

  main{
    max-width:1320px;
    margin:0 auto;
    padding:40px 32px 80px;
  }

  .hero{ text-align:center; margin-bottom:32px; }
  .hero h1{ color:var(--teal); text-transform:uppercase; font-size:26px; margin:0 0 6px; }
  .hero p{ color:var(--muted); margin:0; font-size:14.5px; }

  .promo-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
  }
  @media (max-width:900px){
    .promo-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width:640px){
    .promo-grid{ grid-template-columns:1fr; }
  }

  .promo-card{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:20px 22px 24px;
    box-shadow:0 8px 24px rgba(14,47,68,0.05);
    text-align:center;
  }
  .promo-card-image{
    display:none;
    width:100%;
    aspect-ratio:4 / 5;
    height:auto;
    object-fit:contain;
    background:var(--mint);
    border-radius:10px;
    border:1.5px solid var(--line);
    margin-bottom:16px;
  }
  .promo-card-image.show{ display:block; }

  .cta{
    display:block;
    width:100%;
    padding:13px;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14.5px;
    font-weight:700;
    font-family:'Montserrat', sans-serif;
    cursor:pointer;
    text-decoration:none;
    box-sizing:border-box;
  }
  .cta:hover{ background:var(--teal-dark); }

  .cta-outline{
    display:inline-block;
    margin-top:12px;
    padding:9px 18px;
    background:#fff;
    color:var(--teal-dark);
    border:1.5px solid var(--teal);
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    font-family:'Montserrat', sans-serif;
    cursor:pointer;
    text-decoration:none;
  }
  .cta-outline:hover{ background:var(--mint); }

  .placeholder{
    text-align:center;
    padding:56px 24px;
    background:var(--mint);
    border-radius:14px;
    border:1.5px dashed #bfe6e2;
  }
  .placeholder .badge{
    display:inline-block;
    background:var(--teal);
    color:#fff;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:5px 12px;
    border-radius:100px;
    margin-bottom:14px;
  }
  .placeholder h3{ color:var(--navy); margin:0 0 8px; font-size:19px; }
  .placeholder p{ color:var(--muted); margin:0; font-size:13.5px; max-width:420px; margin:0 auto; }

  @media (max-width: 700px){
    header.hub-header{ padding:14px 16px; }
    .brand{ font-size:19px; }
    main{ padding:24px 16px 56px; }
    .hero h1{ font-size:21px; }
  }

  .iframe-wrap{ display:none; }
  .iframe-wrap.show{ display:block; }
  .iframe-wrap iframe{
    width:100%;
    height:calc(100vh - 96px);
    min-height:520px;
    border:0;
    display:block;
  }
  @media (max-width: 700px){
    .iframe-wrap iframe{ height:calc(100vh - 66px); }
  }

  /* Book Now / See full details open here as a true full-screen panel —
     covers the entire viewport, including the header, rather than a
     small centered box or a new tab (silently blocked inside
     stocknetwork's sandboxed embed). Covering everything, with nothing
     peeking through above it, leaves no room for the destination page's
     own duplicate/sticky search bar to show through a gap. */
  .booking-modal-overlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    z-index:2147483647;
  }
  .booking-modal-overlay.show{ display:block; }
  .booking-modal-box{
    background:#fff;
    width:100%;
    height:100%;
    box-shadow:0 -6px 24px rgba(0,0,0,0.15);
    position:relative;
  }
  .booking-modal-close{
    position:absolute;
    top:10px;
    right:14px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:50%;
    width:36px;
    height:36px;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    z-index:2;
    color:var(--navy);
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  .booking-modal-close:hover{ background:var(--mint); }
  .booking-modal-box iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }

  /* Embed mode (?embed=1): strip the topbar, header and nav so this page
     can be dropped straight into an iframe elsewhere (e.g. on
     avantetravel.co.za) without a duplicate header. */
  body.embed .topbar,
  body.embed header.hub-header{
    display:none;
  }
  body.embed main{
    padding-top:24px;
  }
</style>
</head>
<body>

  <div class="topbar">Avante Travel</div>

  <header class="hub-header">
    <div class="brand">AVANTE<span>TRAVEL</span></div>
    <nav class="tabs">
      <a class="tab" href="#promotions">Home</a>
      <a class="tab" id="tab-accommodation" href="#">Book Your Accommodation</a>
      <a class="tab" id="tab-flights" href="#">Flights</a>
      <a class="tab" id="tab-activities" href="#">Activities</a>
      <a class="tab" id="tab-car" href="#">Car Hire</a>
      <a class="tab" id="tab-esim" href="#">Free E-Sim</a>
    </nav>
  </header>

  <div class="iframe-wrap" id="accomFrameWrap">
    <iframe id="accomFrame" title="Accommodation booking"></iframe>
  </div>

  <div class="booking-modal-overlay" id="bookingModalOverlay">
    <div class="booking-modal-box">
      <button type="button" class="booking-modal-close" id="bookingModalClose" aria-label="Close">&times;</button>
      <iframe id="bookingModalFrame" title="Booking details"></iframe>
    </div>
  </div>

  <main id="promotions">
    <div class="hero">
      <h1>Special Offers</h1>
      <p>Brought to you by Avante Travel</p>
    </div>
    <div id="content">
      <div class="placeholder">
        <div class="badge">Loading</div>
        <h3>Fetching current offers&hellip;</h3>
        <p>One moment please.</p>
      </div>
    </div>
  </main>

  <script>
    // ---------- Shared: affiliate ID from the URL ----------
    var params = new URLSearchParams(window.location.search);
    var aff = (params.get('aff') || '').trim();

    // ---------- Embed mode ----------
    // ?embed=1 strips the topbar/header/nav, leaving just the promotions
    // grid — meant for embedding this page in an iframe (e.g. on
    // avantetravel.co.za) without stacking a second header.
    var embed = (params.get('embed') || '').trim();
    if(embed === '1' || embed.toLowerCase() === 'true'){
      document.body.classList.add('embed');
    }
    var isEmbed = document.body.classList.contains('embed');

    // ---------- Header nav links ----------
    // Jean will supply the real destination URL for the remaining categories.
    // Until then, each tab is shown but disabled (greyed out, not clickable).
    // Accommodation and Flights already have real, per-affiliate destinations:
    // Accommodation goes to this affiliate's own personal StockNetwork booking
    // portal (same base link used throughout the Hub), and Flights goes to the
    // shared Impact.com/Travelstart tracking link with this affiliate's ID
    // appended as a Sub ID — both track bookings back to this exact affiliate.
    var STOCKNETWORK_BASE = 'https://stock.stocknetwork.co.za/ui/';
    var FLIGHT_BASE_URL = 'https://travelstart.zwjlk6.net/LPVYJM';
    // Car rental — test/placeholder link until a real car rental affiliate
    // program is signed up. Same subId1 tracking pattern as Flights, kept in
    // sync with hub.html's CAR_BASE_URL.
    var CAR_BASE_URL = 'https://www.avis.co.za';
    // Free E-Sim — same subId1 tracking pattern as Flights/Car Hire above,
    // kept in sync with hub.html's ESIM_BASE_URL.
    var ESIM_BASE_URL = 'https://avante.1-esim.com/';
    var CATEGORY_LINKS = {
      accommodation: aff ? (STOCKNETWORK_BASE + encodeURIComponent(aff)) : '',
      flights: aff ? (FLIGHT_BASE_URL + (FLIGHT_BASE_URL.indexOf('?') === -1 ? '?' : '&') + 'subId1=' + encodeURIComponent(aff)) : '',
      activities: '',
      car: aff ? (CAR_BASE_URL + (CAR_BASE_URL.indexOf('?') === -1 ? '?' : '&') + 'subId1=' + encodeURIComponent(aff)) : '',
      esim: aff ? (ESIM_BASE_URL + (ESIM_BASE_URL.indexOf('?') === -1 ? '?' : '&') + 'subId1=' + encodeURIComponent(aff)) : ''
    };
    // Book Your Accommodation opens inline, in an iframe right below the
    // header, in the same window — instead of navigating away or opening a
    // new tab. Flights, Car Hire and Free E-Sim are third-party affiliate
    // tracking links, so they open in a new tab instead: this keeps Home
    // (the Great Deals grid) open, untouched, in the original tab (so
    // there's always something to come back to) without risking their
    // tracking cookies the way embedding them in an iframe would.
    var accomFrameWrap = document.getElementById('accomFrameWrap');
    var accomFrame = document.getElementById('accomFrame');
    var mainEl = document.getElementById('promotions');

    function showAccommodationFrame(url){
      if(!accomFrame.getAttribute('src')){ accomFrame.src = url; }
      mainEl.style.display = 'none';
      accomFrameWrap.classList.add('show');
      window.scrollTo(0, 0);
    }
    function hideAccommodationFrame(){
      accomFrameWrap.classList.remove('show');
      mainEl.style.display = '';
    }

    Object.keys(CATEGORY_LINKS).forEach(function(key){
      var el = document.getElementById('tab-' + key);
      var url = CATEGORY_LINKS[key];
      if(url){
        el.href = url;
        if(key === 'accommodation'){
          el.addEventListener('click', function(e){
            e.preventDefault();
            showAccommodationFrame(url);
          });
        }else{
          el.target = '_blank';
          el.rel = 'noopener';
        }
      }else{
        el.removeAttribute('href');
        el.classList.add('disabled');
        el.setAttribute('aria-disabled', 'true');
        el.title = 'Coming soon';
      }
    });

    // ---------- Booking modal (Book Now / See full details) ----------
    var bookingModalOverlay = document.getElementById('bookingModalOverlay');
    var bookingModalFrame = document.getElementById('bookingModalFrame');
    var bookingModalClose = document.getElementById('bookingModalClose');

    function openBookingModal(url){
      // Full-screen — covers the header too, with no gap anywhere for
      // stocknetwork's own duplicate/sticky search bar to show through.
      window.scrollTo(0, 0);
      bookingModalFrame.src = url;
      bookingModalOverlay.classList.add('show');
    }
    function closeBookingModal(){
      bookingModalOverlay.classList.remove('show');
      bookingModalFrame.src = 'about:blank';
    }
    bookingModalClose.addEventListener('click', closeBookingModal);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ closeBookingModal(); }
    });

    // Home is the Great Deals grid itself (main#promotions), so it's
    // already what's showing by default — no need to force it on load
    // the way Accommodation used to be. Clicking Home while the
    // Accommodation iframe is open just needs to hide that iframe again.
    var promotionsTab = document.querySelector('a.tab[href="#promotions"]');
    if(promotionsTab){
      promotionsTab.addEventListener('click', hideAccommodationFrame);
    }

    // ---------- Promotions grid ----------
    var content = document.getElementById('content');
    var HOOK_COUNT = 6;

    function escapeHtml(s){
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
    function isSafeUrl(u){
      return typeof u === 'string' && /^https?:\/\//i.test(u);
    }
    function renderMessage(title, body){
      content.innerHTML =
        '<div class="placeholder">' +
          '<div class="badge">Unavailable</div>' +
          '<h3>' + escapeHtml(title) + '</h3>' +
          '<p>' + escapeHtml(body) + '</p>' +
        '</div>';
    }

    if(!aff){
      renderMessage('This link is incomplete', 'Please check the link you were given, or contact the person who shared it with you.');
    } else {
      var requests = [];
      for(var i = 1; i <= HOOK_COUNT; i++){
        (function(n){
          requests.push(
            fetch('/api/hook?aff=' + encodeURIComponent(aff) + '&hook=' + n)
              .then(function(r){ return r.json(); })
              .then(function(data){ return { n: n, data: data }; })
              .catch(function(){ return { n: n, data: null }; })
          );
        })(i);
      }

      Promise.all(requests).then(function(results){
        var active = results.filter(function(r){
          return r.data && (isSafeUrl(r.data.booking) || isSafeUrl(r.data.landing));
        });

        if(!active.length){
          renderMessage('No active offers right now', 'Please check back again soon.');
          return;
        }

        var html = '<div class="promo-grid">';
        active.forEach(function(r){
          html += '<div class="promo-card">';
          html += '<img class="promo-card-image" id="promoImg' + r.n + '" alt="">';
          // Book Now is left out of the embed (?embed=1) version — the
          // headerless link Jean embeds on her own site — because
          // stocknetwork's sandboxed iframe blocks new-tab popups there,
          // so the button either does nothing or falls back into the same
          // frame and duplicates their search widget. Jean is following up
          // with stocknetwork support to remove that block; once it's
          // fixed this condition can come back out. Standalone (non-embed)
          // visits are unaffected and keep the Book Now button.
          if(isSafeUrl(r.data.booking) && !isEmbed){
            html += '<a class="cta" href="' + escapeHtml(r.data.booking) + '" target="_blank" rel="noopener">Book Now</a>';
          }
          if(isSafeUrl(r.data.landing)){
            html += '<a class="cta-outline" href="' + escapeHtml(r.data.landing) + '" target="_blank" rel="noopener">See full details</a>';
          }
          html += '</div>';
        });
        html += '</div>';
        content.innerHTML = html;

        // Book Now: try to open a real new tab first (leaves this page
        // untouched, exactly like a plain link). stocknetwork's sandboxed
        // embed blocks real popups outright with no way for us to grant
        // that permission from inside the iframe — confirmed live: a
        // plain target="_blank" link did nothing there. So if the
        // browser silently blocks the popup (window.open returns
        // nothing), fall back to opening within the page instead of
        // doing nothing at all. Standalone visits and any less-locked-down
        // embed still get a normal new tab.
        content.querySelectorAll('.cta').forEach(function(a){
          a.addEventListener('click', function(e){
            var url = a.getAttribute('href');
            if(!url){ return; }
            e.preventDefault();
            var win = null;
            try{ win = window.open(url, '_blank'); }catch(err){ win = null; }
            if(!win){
              window.location.href = url;
            }
          });
        });

        // See full details keeps opening in the in-page popup.
        content.querySelectorAll('.cta-outline').forEach(function(a){
          a.addEventListener('click', function(e){
            var url = a.getAttribute('href');
            if(!url){ return; }
            e.preventDefault();
            openBookingModal(url);
          });
        });

        active.forEach(function(r){
          var img = document.getElementById('promoImg' + r.n);
          img.onload = function(){ img.classList.add('show'); };
          img.onerror = function(){ img.classList.remove('show'); };
          img.src = '/api/hook-image?aff=' + encodeURIComponent(aff) + '&hook=' + r.n;
        });
      });
    }
  </script>

</body>
</html>
