<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="860" height="420" fill="#ffffff"/>

  <!-- phone frame: Facebook Group -->
  <rect x="40" y="20" width="260" height="320" rx="30" fill="#0e2f44"/>
  <rect x="53" y="36" width="234" height="288" rx="18" fill="#ffffff"/>

  <rect x="53" y="36" width="234" height="34" rx="18" fill="#0DCDC2"/>
  <rect x="53" y="52" width="234" height="18" fill="#0DCDC2"/>
  <text x="70" y="58" font-size="11" font-weight="700" fill="#ffffff">Plett Travel Deals (Group)</text>

  <!-- pinned rules notice -->
  <rect x="66" y="80" width="208" height="34" rx="8" fill="#f4fbfa" stroke="#bfe6e2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="74" y="94" font-size="9" font-weight="700" fill="#0e2f44">📌 Pinned: Group Rules</text>
  <text x="74" y="106" font-size="8" fill="#808080">Read before posting a link</text>
  <circle cx="252" cy="97" r="13" fill="#0DCDC2"/>
  <text x="252" y="102" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

  <!-- post composer -->
  <rect x="66" y="126" width="208" height="86" rx="8" fill="#f4fbfa" stroke="#e3e9e8" stroke-width="1"/>
  <text x="74" y="142" font-size="8" fill="#0e2f44">📍 The Dunes, Plett — 12–19</text>
  <text x="74" y="154" font-size="8" fill="#0e2f44">Dec still open! Book here:</text>
  <text x="74" y="166" font-size="8" font-weight="700" fill="#1877f2">go.avantetravel.co.za/v4JMWj</text>
  <rect x="74" y="176" width="180" height="26" rx="4" fill="#ffffff" stroke="#e3e9e8"/>
  <text x="80" y="192" font-size="7" fill="#808080">Link preview card</text>
  <circle cx="252" cy="150" r="13" fill="#0DCDC2"/>
  <text x="252" y="155" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

  <!-- post button -->
  <rect x="66" y="222" width="208" height="26" rx="13" fill="#0DCDC2"/>
  <text x="170" y="239" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Post</text>
  <circle cx="252" cy="235" r="13" fill="#0DCDC2"/>
  <text x="252" y="240" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>

  <!-- comments row -->
  <rect x="66" y="264" width="208" height="1" fill="#e3e9e8"/>
  <text x="72" y="290" font-size="12">💬</text>
  <rect x="94" y="282" width="120" height="8" rx="4" fill="#e3e9e8"/>
  <rect x="94" y="294" width="70" height="6" rx="3" fill="#f4fbfa"/>

  <!-- legend -->
  <circle cx="345" cy="70" r="14" fill="#0DCDC2"/>
  <text x="345" y="75" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="372" y="60" font-size="15" font-weight="700" fill="#0e2f44">Check the group's rules first</text>
  <text x="372" y="78" font-size="13" fill="#808080">Look for a pinned post about promotional content — some</text>
  <text x="372" y="96" font-size="13" fill="#808080">groups restrict links to certain days or ban them entirely.</text>

  <circle cx="345" cy="150" r="14" fill="#0DCDC2"/>
  <text x="345" y="155" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="372" y="140" font-size="15" font-weight="700" fill="#0e2f44">Write your post</text>
  <text x="372" y="158" font-size="13" fill="#808080">Paste your shortened link directly into the text — unlike</text>
  <text x="372" y="176" font-size="13" fill="#808080">Instagram or TikTok, it's tappable right away in a Group post.</text>

  <circle cx="345" cy="230" r="14" fill="#0DCDC2"/>
  <text x="345" y="235" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="372" y="220" font-size="15" font-weight="700" fill="#0e2f44">Tap Post</text>
  <text x="372" y="238" font-size="13" fill="#808080">Your post appears in the group's feed for members to see,</text>
  <text x="372" y="256" font-size="13" fill="#808080">comment on, or message you about.</text>

  <text x="345" y="310" font-size="12" fill="#0aa89f" font-style="italic">Illustrative — group layouts and posting rules vary widely</text>
  <text x="345" y="326" font-size="12" fill="#0aa89f" font-style="italic">from group to group.</text>
</svg>
