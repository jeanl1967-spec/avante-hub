<svg viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="860" height="320" fill="#ffffff"/>

  <!-- phone frame: Marketplace listing -->
  <rect x="40" y="20" width="260" height="280" rx="30" fill="#0e2f44"/>
  <rect x="53" y="36" width="234" height="248" rx="18" fill="#ffffff"/>

  <rect x="53" y="36" width="234" height="34" rx="18" fill="#0DCDC2"/>
  <rect x="53" y="52" width="234" height="18" fill="#0DCDC2"/>
  <text x="70" y="58" font-size="12" font-weight="700" fill="#ffffff">Create New Listing</text>

  <!-- photo placeholder -->
  <rect x="66" y="80" width="90" height="70" rx="8" fill="#f4fbfa" stroke="#bfe6e2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="111" y="122" font-size="20" text-anchor="middle">🏖️</text>

  <!-- category field -->
  <rect x="164" y="80" width="110" height="32" rx="6" fill="#ffffff" stroke="#e3e9e8"/>
  <text x="170" y="93" font-size="7" fill="#808080">CATEGORY</text>
  <text x="170" y="106" font-size="8" fill="#0e2f44">Vacation Rentals ▾</text>
  <circle cx="252" cy="80" r="13" fill="#0DCDC2"/>
  <text x="252" y="85" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

  <!-- description field -->
  <rect x="66" y="160" width="208" height="70" rx="8" fill="#f4fbfa" stroke="#e3e9e8" stroke-width="1"/>
  <text x="74" y="176" font-size="8" fill="#0e2f44">The Dunes, Plettenberg Bay —</text>
  <text x="74" y="188" font-size="8" fill="#0e2f44">available 12–19 Dec. Book here:</text>
  <text x="74" y="200" font-size="8" font-weight="700" fill="#0aa89f">go.avantetravel.co.za/v4JMWj</text>
  <circle cx="252" cy="185" r="13" fill="#0DCDC2"/>
  <text x="252" y="190" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

  <!-- publish button -->
  <rect x="66" y="242" width="208" height="26" rx="13" fill="#0DCDC2"/>
  <text x="170" y="259" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Publish</text>

  <!-- legend -->
  <circle cx="345" cy="70" r="14" fill="#0DCDC2"/>
  <text x="345" y="75" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="372" y="60" font-size="15" font-weight="700" fill="#0e2f44">Check for a Vacation Rentals category</text>
  <text x="372" y="78" font-size="13" fill="#808080">Not every region has this Marketplace category — if you</text>
  <text x="372" y="96" font-size="13" fill="#808080">don't see it, Marketplace may not be the right tool here;</text>
  <text x="372" y="114" font-size="13" fill="#808080">focus on Groups instead (see step 2 above).</text>

  <circle cx="345" cy="165" r="14" fill="#0DCDC2"/>
  <text x="345" y="170" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="372" y="155" font-size="15" font-weight="700" fill="#0e2f44">Add photos and description</text>
  <text x="372" y="173" font-size="13" fill="#808080">Add real photos if you have them, then put your shortened</text>
  <text x="372" y="191" font-size="13" fill="#808080">link in the description, then tap Publish.</text>

  <text x="345" y="240" font-size="12" fill="#0aa89f" font-style="italic">Illustrative — Marketplace categories and availability vary</text>
  <text x="345" y="256" font-size="12" fill="#0aa89f" font-style="italic">by country. This step is optional; Groups usually convert better.</text>
</svg>
