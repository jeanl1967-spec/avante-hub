<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="860" height="420" fill="#ffffff"/>

  <!-- phone frame: Reel composer -->
  <rect x="40" y="20" width="260" height="300" rx="30" fill="#0e2f44"/>
  <rect x="53" y="36" width="234" height="268" rx="18" fill="#ffffff"/>

  <rect x="53" y="36" width="234" height="34" rx="18" fill="#0DCDC2"/>
  <rect x="53" y="52" width="234" height="18" fill="#0DCDC2"/>
  <text x="70" y="58" font-size="12" font-weight="700" fill="#ffffff">New Reel</text>

  <!-- video placeholder -->
  <rect x="66" y="80" width="208" height="130" rx="10" fill="#f4fbfa" stroke="#bfe6e2" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="160,130 160,160 185,145" fill="#0aa89f"/>
  <text x="170" y="195" font-size="24" text-anchor="middle">🏖️</text>

  <!-- caption box -->
  <rect x="66" y="220" width="208" height="44" rx="8" fill="#f4fbfa" stroke="#e3e9e8" stroke-width="1"/>
  <text x="74" y="234" font-size="8" fill="#0e2f44">📍 The Dunes, Plett — 12–19 Dec</text>
  <text x="74" y="246" font-size="8" fill="#0e2f44">still open! Book your stay —</text>
  <text x="74" y="258" font-size="8" font-weight="700" fill="#0aa89f">🔗 link in bio</text>
  <circle cx="252" cy="228" r="13" fill="#0DCDC2"/>
  <text x="252" y="233" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

  <!-- share button -->
  <rect x="66" y="272" width="208" height="26" rx="13" fill="#0DCDC2"/>
  <text x="170" y="289" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Share</text>
  <circle cx="252" cy="285" r="13" fill="#0DCDC2"/>
  <text x="252" y="290" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

  <!-- bio panel -->
  <rect x="40" y="336" width="260" height="66" rx="12" fill="#f4fbfa" stroke="#bfe6e2" stroke-width="1.5"/>
  <text x="52" y="354" font-size="10" font-weight="700" fill="#0e2f44">Edit profile</text>
  <text x="52" y="370" font-size="8" fill="#808080">WEBSITE</text>
  <rect x="52" y="376" width="220" height="18" rx="5" fill="#ffffff" stroke="#e3e9e8"/>
  <text x="58" y="389" font-size="8" fill="#0aa89f">go.avantetravel.co.za/v4JMWj</text>
  <circle cx="330" cy="369" r="13" fill="#0DCDC2"/>
  <text x="330" y="374" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>

  <!-- legend -->
  <circle cx="410" cy="56" r="13" fill="#0DCDC2"/>
  <text x="410" y="61" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="435" y="52" font-size="15" font-weight="700" fill="#0e2f44">Write "link in bio" in your caption</text>
  <text x="435" y="70" font-size="13" fill="#808080">Links typed into a Reel or post caption are NOT tappable</text>
  <text x="435" y="88" font-size="13" fill="#808080">on Instagram or Facebook — so tell people where to find it.</text>

  <circle cx="410" cy="125" r="13" fill="#0DCDC2"/>
  <text x="410" y="130" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="435" y="121" font-size="15" font-weight="700" fill="#0e2f44">Tap Share to post your Reel</text>
  <text x="435" y="139" font-size="13" fill="#808080">Do this before or after updating your bio link below —</text>
  <text x="435" y="157" font-size="13" fill="#808080">the order doesn't matter.</text>

  <circle cx="410" cy="198" r="13" fill="#0DCDC2"/>
  <text x="410" y="203" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="435" y="194" font-size="15" font-weight="700" fill="#0e2f44">Update your bio link</text>
  <text x="435" y="212" font-size="13" fill="#808080">Go to your profile → Edit profile → paste your shortened</text>
  <text x="435" y="230" font-size="13" fill="#808080">link into the Website field → tap Done.</text>
  <text x="435" y="248" font-size="13" fill="#808080">This is what "link in bio" actually points to.</text>

  <text x="410" y="290" font-size="12" fill="#0aa89f" font-style="italic">Tip: if you promote different resorts often, keep your bio</text>
  <text x="410" y="306" font-size="12" fill="#0aa89f" font-style="italic">link pointed at your Front Store instead of one property,</text>
  <text x="410" y="322" font-size="12" fill="#0aa89f" font-style="italic">and use a Story link sticker (see above) for one-off promos.</text>

  <text x="410" y="360" font-size="12" fill="#0aa89f" font-style="italic">Illustrative — Instagram and Facebook's screens vary slightly</text>
  <text x="410" y="376" font-size="12" fill="#0aa89f" font-style="italic">and update from time to time.</text>
</svg>
