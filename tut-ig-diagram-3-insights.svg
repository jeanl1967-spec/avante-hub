<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="860" height="300" fill="#ffffff"/>

  <!-- phone frame -->
  <rect x="40" y="20" width="260" height="260" rx="30" fill="#0e2f44"/>
  <rect x="53" y="36" width="234" height="228" rx="18" fill="#ffffff"/>

  <rect x="53" y="36" width="234" height="34" rx="18" fill="#0DCDC2"/>
  <rect x="53" y="52" width="234" height="18" fill="#0DCDC2"/>
  <text x="70" y="58" font-size="12" font-weight="700" fill="#ffffff">Story Insights</text>

  <!-- thumbnail -->
  <circle cx="88" cy="98" r="20" fill="none" stroke="#0DCDC2" stroke-width="3"/>
  <circle cx="88" cy="98" r="15" fill="#f4fbfa"/>
  <text x="88" y="103" font-size="14" text-anchor="middle">🏖️</text>

  <!-- stats -->
  <ellipse cx="150" cy="90" rx="9" ry="5.5" fill="none" stroke="#0e2f44" stroke-width="1.6"/>
  <circle cx="150" cy="90" r="2.2" fill="#0e2f44"/>
  <text x="165" y="94" font-size="10" font-weight="700" fill="#0e2f44">148 views</text>

  <text x="145" y="112" font-size="11">🔗</text>
  <text x="165" y="112" font-size="10" font-weight="700" fill="#0e2f44">23 link taps</text>

  <circle cx="252" cy="100" r="13" fill="#0DCDC2"/>
  <text x="252" y="105" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

  <!-- comments row -->
  <rect x="66" y="150" width="208" height="1" fill="#e3e9e8"/>
  <text x="72" y="176" font-size="12">💬</text>
  <rect x="94" y="168" width="120" height="8" rx="4" fill="#e3e9e8"/>
  <rect x="94" y="180" width="70" height="6" rx="3" fill="#f4fbfa"/>
  <circle cx="252" cy="174" r="13" fill="#0DCDC2"/>
  <text x="252" y="179" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

  <text x="72" y="210" font-size="12">✉️</text>
  <rect x="94" y="202" width="120" height="8" rx="4" fill="#e3e9e8"/>
  <rect x="94" y="214" width="70" height="6" rx="3" fill="#f4fbfa"/>

  <!-- legend -->
  <circle cx="345" cy="90" r="14" fill="#0DCDC2"/>
  <text x="345" y="95" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="372" y="80" font-size="15" font-weight="700" fill="#0e2f44">Check your Insights</text>
  <text x="372" y="98" font-size="13" fill="#808080">Tap "Insights" under a posted Story or Reel to see views,</text>
  <text x="372" y="116" font-size="13" fill="#808080">and link taps if you used a link sticker.</text>

  <circle cx="345" cy="170" r="14" fill="#0DCDC2"/>
  <text x="345" y="175" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="372" y="160" font-size="15" font-weight="700" fill="#0e2f44">Reply to comments and DMs</text>
  <text x="372" y="178" font-size="13" fill="#808080">Anyone who comments or messages you about it is a warm</text>
  <text x="372" y="196" font-size="13" fill="#808080">lead — reply quickly and offer to check availability.</text>

  <text x="345" y="240" font-size="12" fill="#0aa89f" font-style="italic">Illustrative — the exact look of Insights varies by app version.</text>
</svg>
