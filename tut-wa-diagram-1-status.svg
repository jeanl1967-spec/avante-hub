<svg viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="860" height="360" fill="#ffffff"/>

  <!-- phone frame -->
  <rect x="40" y="20" width="260" height="320" rx="30" fill="#0e2f44"/>
  <rect x="53" y="36" width="234" height="288" rx="18" fill="#ffffff"/>

  <!-- app top bar -->
  <rect x="53" y="36" width="234" height="34" rx="18" fill="#0DCDC2"/>
  <rect x="53" y="52" width="234" height="18" fill="#0DCDC2"/>
  <text x="70" y="58" font-size="13" font-weight="700" fill="#ffffff">WhatsApp</text>

  <!-- tab row -->
  <rect x="63" y="80" width="60" height="22" rx="11" fill="#f4fbfa"/>
  <text x="78" y="95" font-size="9" font-weight="700" fill="#808080">CHATS</text>

  <rect x="130" y="80" width="60" height="22" rx="11" fill="#0DCDC2"/>
  <text x="140" y="95" font-size="9" font-weight="700" fill="#ffffff">STATUS</text>

  <rect x="197" y="80" width="55" height="22" rx="11" fill="#f4fbfa"/>
  <text x="210" y="95" font-size="9" font-weight="700" fill="#808080">CALLS</text>

  <!-- callout badge 1 pointing at Status tab -->
  <circle cx="160" cy="118" r="13" fill="#0DCDC2"/>
  <text x="160" y="123" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <line x1="160" y1="105" x2="160" y2="112" stroke="#0DCDC2" stroke-width="2"/>

  <!-- photo placeholder -->
  <rect x="66" y="140" width="208" height="90" rx="10" fill="#f4fbfa" stroke="#bfe6e2" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="170" y="192" font-size="30" text-anchor="middle">🏖️</text>

  <!-- camera icon button (add media) -->
  <circle cx="252" cy="152" r="15" fill="#0e2f44"/>
  <text x="252" y="157" font-size="13" text-anchor="middle">📷</text>
  <circle cx="252" cy="122" r="12" fill="#0DCDC2"/>
  <text x="252" y="127" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <line x1="252" y1="134" x2="252" y2="137" stroke="#0DCDC2" stroke-width="2"/>

  <!-- caption bar -->
  <rect x="66" y="238" width="160" height="34" rx="8" fill="#f4fbfa" stroke="#e3e9e8" stroke-width="1"/>
  <text x="74" y="251" font-size="8" fill="#0e2f44">📍 The Dunes, Plett — 12–19</text>
  <text x="74" y="262" font-size="8" fill="#0e2f44">Dec still open! Book here...</text>

  <!-- send button -->
  <circle cx="252" cy="255" r="17" fill="#0DCDC2"/>
  <polygon points="246,247 260,255 246,263 249,255" fill="#ffffff"/>
  <circle cx="252" cy="288" r="12" fill="#0DCDC2"/>
  <text x="252" y="293" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <line x1="252" y1="276" x2="252" y2="272" stroke="#0DCDC2" stroke-width="2"/>

  <!-- legend -->
  <circle cx="345" cy="60" r="14" fill="#0DCDC2"/>
  <text x="345" y="65" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="372" y="56" font-size="15" font-weight="700" fill="#0e2f44">Open WhatsApp</text>
  <text x="372" y="74" font-size="13" fill="#808080">Tap the Status tab at the top (or bottom, on some phones).</text>

  <circle cx="345" cy="140" r="14" fill="#0DCDC2"/>
  <text x="345" y="145" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="372" y="136" font-size="15" font-weight="700" fill="#0e2f44">Tap the camera icon</text>
  <text x="372" y="154" font-size="13" fill="#808080">This opens the "add new Status" screen. Choose a photo</text>
  <text x="372" y="172" font-size="13" fill="#808080">or short video of the resort or destination.</text>

  <circle cx="345" cy="220" r="14" fill="#0DCDC2"/>
  <text x="345" y="225" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="372" y="216" font-size="15" font-weight="700" fill="#0e2f44">Add your caption and link</text>
  <text x="372" y="234" font-size="13" fill="#808080">Tap the text box, type a short caption with your shortened</text>
  <text x="372" y="252" font-size="13" fill="#808080">link, then tap the green/teal Send arrow to post.</text>

  <text x="345" y="300" font-size="12" fill="#0aa89f" font-style="italic">Illustrative — the exact look of WhatsApp's icons and layout</text>
  <text x="345" y="316" font-size="12" fill="#0aa89f" font-style="italic">can vary slightly by phone and app version.</text>
</svg>
