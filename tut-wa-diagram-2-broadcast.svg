<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="860" height="380" fill="#ffffff"/>

  <!-- phone frame -->
  <rect x="40" y="20" width="260" height="340" rx="30" fill="#0e2f44"/>
  <rect x="53" y="36" width="234" height="308" rx="18" fill="#ffffff"/>

  <!-- app top bar -->
  <rect x="53" y="36" width="234" height="34" rx="18" fill="#0DCDC2"/>
  <rect x="53" y="52" width="234" height="18" fill="#0DCDC2"/>
  <text x="70" y="58" font-size="13" font-weight="700" fill="#ffffff">Chats</text>

  <!-- 3-dot menu icon -->
  <circle cx="266" cy="53" r="3" fill="#ffffff"/>
  <circle cx="266" cy="53" r="3" fill="#ffffff" transform="translate(-8,0)"/>
  <circle cx="266" cy="53" r="3" fill="#ffffff" transform="translate(-16,0)"/>
  <circle cx="345" cy="53" r="14" fill="#0DCDC2"/>
  <text x="345" y="58" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

  <!-- dropdown menu -->
  <rect x="150" y="76" width="130" height="66" rx="8" fill="#ffffff" stroke="#e3e9e8" stroke-width="1.5"/>
  <rect x="150" y="76" width="130" height="26" rx="8" fill="#0DCDC2"/>
  <text x="160" y="93" font-size="10" font-weight="700" fill="#ffffff">New broadcast</text>
  <text x="160" y="118" font-size="10" fill="#808080">New group</text>
  <text x="160" y="136" font-size="10" fill="#808080">Settings</text>
  <circle cx="345" cy="89" r="14" fill="#0DCDC2"/>
  <text x="345" y="94" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

  <!-- contact checklist -->
  <circle cx="82" cy="168" r="12" fill="#f4fbfa" stroke="#bfe6e2"/>
  <rect x="100" y="161" width="110" height="8" rx="4" fill="#e3e9e8"/>
  <rect x="100" y="173" width="70" height="6" rx="3" fill="#f4fbfa"/>
  <circle cx="255" cy="168" r="9" fill="#0DCDC2"/>
  <text x="255" y="172" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>

  <circle cx="82" cy="200" r="12" fill="#f4fbfa" stroke="#bfe6e2"/>
  <rect x="100" y="193" width="110" height="8" rx="4" fill="#e3e9e8"/>
  <rect x="100" y="205" width="70" height="6" rx="3" fill="#f4fbfa"/>
  <circle cx="255" cy="200" r="9" fill="#0DCDC2"/>
  <text x="255" y="204" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>

  <circle cx="82" cy="232" r="12" fill="#f4fbfa" stroke="#bfe6e2"/>
  <rect x="100" y="225" width="110" height="8" rx="4" fill="#e3e9e8"/>
  <rect x="100" y="237" width="70" height="6" rx="3" fill="#f4fbfa"/>
  <circle cx="255" cy="232" r="9" fill="#e3e9e8"/>

  <circle cx="345" cy="200" r="14" fill="#0DCDC2"/>
  <text x="345" y="205" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>

  <!-- send / create button -->
  <rect x="66" y="270" width="208" height="34" rx="17" fill="#0DCDC2"/>
  <text x="170" y="292" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Create</text>
  <circle cx="345" cy="287" r="14" fill="#0DCDC2"/>
  <text x="345" y="292" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>

  <!-- legend -->
  <circle cx="410" cy="56" r="13" fill="#0DCDC2"/>
  <text x="410" y="61" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="435" y="52" font-size="15" font-weight="700" fill="#0e2f44">Open Chats, tap the menu</text>
  <text x="435" y="70" font-size="13" fill="#808080">Look for three dots (⋮) or three lines (≡) in the top corner.</text>

  <circle cx="410" cy="98" r="13" fill="#0DCDC2"/>
  <text x="410" y="103" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="435" y="94" font-size="15" font-weight="700" fill="#0e2f44">Tap "New broadcast"</text>
  <text x="435" y="112" font-size="13" fill="#808080">This starts a new broadcast list you can reuse anytime.</text>

  <circle cx="410" cy="200" r="13" fill="#0DCDC2"/>
  <text x="410" y="205" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="435" y="182" font-size="15" font-weight="700" fill="#0e2f44">Select who should receive it</text>
  <text x="435" y="200" font-size="13" fill="#808080">Tick past clients or prospects who'd be interested in this</text>
  <text x="435" y="218" font-size="13" fill="#808080">destination. Only contacts who have saved your number</text>
  <text x="435" y="236" font-size="13" fill="#808080">will actually receive it.</text>

  <circle cx="410" cy="287" r="13" fill="#0DCDC2"/>
  <text x="410" y="292" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
  <text x="435" y="283" font-size="15" font-weight="700" fill="#0e2f44">Send your message and link</text>
  <text x="435" y="301" font-size="13" fill="#808080">Open the new broadcast chat and send the same caption</text>
  <text x="435" y="319" font-size="13" fill="#808080">and shortened link — each contact gets it individually.</text>

  <text x="410" y="350" font-size="12" fill="#0aa89f" font-style="italic">Illustrative — the exact look of WhatsApp's menus can vary by phone.</text>
</svg>
