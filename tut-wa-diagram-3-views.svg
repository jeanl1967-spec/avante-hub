<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="860" height="300" fill="#ffffff"/>

  <!-- phone frame -->
  <rect x="40" y="20" width="260" height="260" rx="30" fill="#0e2f44"/>
  <rect x="53" y="36" width="234" height="228" rx="18" fill="#ffffff"/>

  <!-- app top bar -->
  <rect x="53" y="36" width="234" height="34" rx="18" fill="#0DCDC2"/>
  <rect x="53" y="52" width="234" height="18" fill="#0DCDC2"/>
  <text x="70" y="58" font-size="13" font-weight="700" fill="#ffffff">My Status</text>

  <!-- status row -->
  <circle cx="88" cy="98" r="20" fill="none" stroke="#0DCDC2" stroke-width="3"/>
  <circle cx="88" cy="98" r="15" fill="#f4fbfa"/>
  <text x="88" y="103" font-size="14" text-anchor="middle">🏖️</text>
  <rect x="118" y="88" width="90" height="8" rx="4" fill="#e3e9e8"/>
  <rect x="118" y="102" width="60" height="6" rx="3" fill="#f4fbfa"/>

  <!-- eye icon + count -->
  <ellipse cx="245" cy="96" rx="10" ry="6" fill="none" stroke="#0e2f44" stroke-width="1.6"/>
  <circle cx="245" cy="96" r="2.4" fill="#0e2f44"/>
  <text x="262" y="100" font-size="11" font-weight="700" fill="#0e2f44">12</text>
  <circle cx="252" cy="128" r="13" fill="#0DCDC2"/>
  <text x="252" y="133" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <line x1="248" y1="105" x2="250" y2="116" stroke="#0DCDC2" stroke-width="2"/>

  <!-- viewer list -->
  <rect x="66" y="150" width="208" height="1" fill="#e3e9e8"/>
  <circle cx="82" cy="172" r="11" fill="#f4fbfa" stroke="#bfe6e2"/>
  <rect x="100" y="166" width="100" height="7" rx="3.5" fill="#e3e9e8"/>
  <rect x="100" y="177" width="50" height="5" rx="2.5" fill="#f4fbfa"/>

  <circle cx="82" cy="202" r="11" fill="#f4fbfa" stroke="#bfe6e2"/>
  <rect x="100" y="196" width="100" height="7" rx="3.5" fill="#e3e9e8"/>
  <rect x="100" y="207" width="50" height="5" rx="2.5" fill="#f4fbfa"/>

  <circle cx="82" cy="232" r="11" fill="#f4fbfa" stroke="#bfe6e2"/>
  <rect x="100" y="226" width="100" height="7" rx="3.5" fill="#e3e9e8"/>
  <rect x="100" y="237" width="50" height="5" rx="2.5" fill="#f4fbfa"/>

  <!-- legend -->
  <circle cx="345" cy="100" r="14" fill="#0DCDC2"/>
  <text x="345" y="105" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="372" y="90" font-size="15" font-weight="700" fill="#0e2f44">Tap the eye icon</text>
  <text x="372" y="108" font-size="13" fill="#808080">Under your posted Status, this shows exactly who has</text>
  <text x="372" y="126" font-size="13" fill="#808080">viewed it, and how many times.</text>

  <circle cx="345" cy="170" r="14" fill="#0DCDC2"/>
  <text x="345" y="175" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="372" y="160" font-size="15" font-weight="700" fill="#0e2f44">Follow up personally</text>
  <text x="372" y="178" font-size="13" fill="#808080">Message anyone who viewed more than once, or who</text>
  <text x="372" y="196" font-size="13" fill="#808080">replies — that's usually genuine interest. Try: "Want me</text>
  <text x="372" y="214" font-size="13" fill="#808080">to check availability for your dates?"</text>

  <text x="345" y="260" font-size="12" fill="#0aa89f" font-style="italic">Illustrative — the exact look of WhatsApp's Status screen can vary by phone.</text>
</svg>
